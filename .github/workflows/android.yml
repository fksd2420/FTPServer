name: Android CI Build

on:
  push:
#    branches: [ "main" ]
    tags:
      - "v*"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up Java Environment (Adjust version if your app uses Java 11 or 21)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle' # Automatically caches Gradle dependencies to speed up future builds

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleRelease

    - name: Rename APK with Tag
      run: |
        ls app/build
        ls app/build/outputs
        ls app/build/outputs/apk
        ls app/build/outputs/apk/release
        TAG_NAME=${GITHUB_REF#refs/tags/}
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/com.fksd2420.ftpserver.apk

    - name: Create GitHub Release and Upload APKs
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          app/build/outputs/apk/release/*.apk
