name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up Java Environment (Adjust version if your app uses Java 11 or 21)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle' # Automatically caches Gradle dependencies to speed up future builds

    # Step 3: Grant execute permission to the Gradle wrapper
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew


    # Step 5: Compile the Debug APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # Step 6: Upload the generated APK file so you can download it
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
